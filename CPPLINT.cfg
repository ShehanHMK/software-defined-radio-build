# Stop cpplint from searching parent directories for other CPPLINT.cfg files
set noparent

# Set maximum line length (Google default is 80)
linelength=80

# Specify file extensions to analyze
extensions=cpp,cc,cxx,h,hpp

# Set the root folder relative to header guard paths (e.g., #ifndef SRC_FOO_H_)
root=src

# Rule filters (+ to enable, - to disable)
# -----------------------------------------------------------------
# Disable top-of-file copyright header requirement
filter=-legal/copyright

# Disable legacy warnings for standard C++11 header includes
filter=-build/c++11

# Suppress header guard formatting warnings if using `#pragma once`
# filter=-build/header_guard

# Suppress indentation rules for C++ namespaces
# filter=-runtime/indentation_namespace